[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-observability-evals"
version = "0.1.0"
description = "Tracing for LLM pipelines that no-ops without credentials, plus an LLM-as-judge evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Chavez" }]
dependencies = []

[project.optional-dependencies]
# Real tracing backend; without it (and without keys) tracing is a no-op.
langfuse = ["langfuse>=3.0"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
